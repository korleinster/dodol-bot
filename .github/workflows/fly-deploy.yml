name: Deploy to Fly.io (staging)

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy all bots to fly.io (nrt, scale=0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install flyctl
        run: |
          # 공식 action 없이 apt-get 또는 curl 순서로 설치
          if apt-cache show flyctl &>/dev/null 2>&1; then
            sudo apt-get install -y flyctl
          else
            for i in 1 2 3; do
              curl -fsSL https://fly.io/install.sh | sh && break
              echo "설치 시도 $i 실패, 5초 후 재시도..."
              sleep 5
            done
            echo "$HOME/.fly/bin" >> $GITHUB_PATH
          fi

      - name: Deploy all bots (image only, scale=0)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          for n in 001 002 003 004; do
            echo "==> dodol-bot-$n 배포 중..."
            flyctl deploy --config fly.${n}.toml --app dodol-bot-${n} \
              --remote-only \
              --strategy immediate \
              --smoke-checks=false
            flyctl scale count 0 --app dodol-bot-${n} --yes
            echo "==> dodol-bot-$n 완료 (scale=0)"
          done
