name: Deploy to Fly.io (staging)

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy all bots to fly.io (nrt, scale=0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install flyctl
        run: |
          # 공식 action 없이 apt-get 또는 curl 순서로 설치
          if apt-cache show flyctl &>/dev/null 2>&1; then
            sudo apt-get install -y flyctl
          else
            for i in 1 2 3; do
              curl -fsSL https://fly.io/install.sh | sh && break
              echo "설치 시도 $i 실패, 5초 후 재시도..."
              sleep 5
            done
            echo "$HOME/.fly/bin" >> $GITHUB_PATH
          fi

      - name: Build & push images to fly.io registry (scale=0 유지)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # --build-only: 이미지 빌드 후 레지스트리에 푸시만 (머신 생성 없음)
          # 활성화 시 fly-activate.sh 가 scale=1 로 머신 생성
          for n in 001 002 003 004; do
            echo "==> dodol-bot-$n 이미지 빌드 중..."
            flyctl deploy --config fly.${n}.toml --app dodol-bot-${n} \
              --remote-only \
              --build-only
            echo "==> dodol-bot-$n 이미지 업데이트 완료"
          done
