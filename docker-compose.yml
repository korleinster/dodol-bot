x-runtime-environment: &runtime-environment
  DB_PATH: ${DB_PATH:-./data/bot.db}
  PLAYNC_API_KEY: ${PLAYNC_API_KEY:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  BOTAM_WEB_BRIDGE_ENABLED: "1"
  BOTAM_BRIDGE_GID: ${DODOL_GID:-1000}

services:
  dodol-bot-001:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: dodol-bot:latest
    restart: always
    environment:
      <<: *runtime-environment
      BOT_NUMBER: "1"
      TTS_PROVIDER: ${TTS_PROVIDER_001:-edge}
      TTS_EDGE_VOICE: ${TTS_EDGE_VOICE_001:-ko-KR-SunHiNeural}
      TTS_EDGE_RATE: ${TTS_EDGE_RATE_001:-+8%}
      TTS_EDGE_PITCH: ${TTS_EDGE_PITCH_001:-+8Hz}
      DISCORD_TOKEN_001: ${DISCORD_TOKEN_001:?DISCORD_TOKEN_001 is required}
      BOTAM_BRIDGE_001_SECRET: ${BOTAM_BRIDGE_001_SECRET:?BOTAM_BRIDGE_001_SECRET is required}
      BOTAM_BRIDGE_001_SOCKET: /app/data/botam-001.sock
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-m", "src.health_probe"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 4
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

