x-runtime-environment: &runtime-environment
  DB_PATH: ${DB_PATH:-./data/bot.db}
  PLAYNC_API_KEY: ${PLAYNC_API_KEY:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  BOTAM_WEB_BRIDGE_ENABLED: "1"
  BOTAM_BRIDGE_GID: ${DODOL_GID:-1000}

services:
  dodol-bot-001:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: dodol-bot:latest
    restart: always
    environment:
      <<: *runtime-environment
      BOT_NUMBER: "1"
      DISCORD_TOKEN_001: ${DISCORD_TOKEN_001:?DISCORD_TOKEN_001 is required}
      BOTAM_BRIDGE_001_SECRET: ${BOTAM_BRIDGE_001_SECRET:?BOTAM_BRIDGE_001_SECRET is required}
      BOTAM_BRIDGE_001_SOCKET: /app/data/botam-001.sock
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  dodol-bot-002:
    image: dodol-bot:latest
    restart: always
    environment:
      <<: *runtime-environment
      BOT_NUMBER: "2"
      DISCORD_TOKEN_002: ${DISCORD_TOKEN_002:?DISCORD_TOKEN_002 is required}
