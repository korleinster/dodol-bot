services:
  dodol-bot-001:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: dodol-bot:latest
    restart: always
    env_file: .env
    environment:
      BOT_NUMBER: "1"
      BOTAM_WEB_BRIDGE_ENABLED: "1"
      BOTAM_BRIDGE_001_SECRET: ${BOTAM_BRIDGE_001_SECRET:-}
      BOTAM_BRIDGE_001_SOCKET: /app/data/botam-001.sock
      BOTAM_BRIDGE_GID: ${DODOL_GID:-1000}
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  dodol-bot-002:
    image: dodol-bot:latest
    restart: always
    env_file: .env
    environment:
      BOT_NUMBER: "2"
      BOTAM_WEB_BRIDGE_ENABLED: "1"
